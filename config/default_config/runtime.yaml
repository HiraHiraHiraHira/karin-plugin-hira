# 临时文件根目录。留空时使用 Karin 数据目录下的 hira/temp。
tempRoot: ""

# 是否启用临时文件自动清理
cleanupEnabled: true

# 临时文件最长保留时间，单位分钟
cleanupMaxAgeMinutes: 120

# ffmpeg 路径
ffmpegPath: "ffmpeg"

# ffprobe 路径
ffprobePath: "ffprobe"

# 下载超时时间，单位秒
downloadTimeoutSeconds: 60

# 单个视频/音频媒体文件下载上限，单位字节；默认 200 MiB。
maxVideoFileSizeBytes: 209715200

# 预览封面内联上限，单位字节；默认 10 MiB。
maxPreviewCoverBytes: 10485760

# 临时目录总容量上限，单位字节；默认 2 GiB。超出后优先清理最旧文件。
maxTempBytes: 2147483648
